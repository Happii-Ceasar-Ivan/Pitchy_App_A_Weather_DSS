name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", "supabase/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "supabase/**", ".github/workflows/backend-ci.yml"]

# Least privilege: this workflow only reads the code. No secrets are used.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Disposable database for migration/RLS/lock tests. Throwaway credentials, not a secret.
    # The official pgvector build of Postgres 17: B5's migration needs the vector extension
    # (Supabase has it; the plain postgres image does not).
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pitchy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PITCHY_ENV: test
      PITCHY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pitchy_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3  # no major tags since v8; pin the exact release
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests (includes API contract freshness)
        run: uv run pytest -q
