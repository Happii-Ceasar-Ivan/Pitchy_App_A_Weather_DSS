name: Backend image

# Builds backend/Dockerfile and publishes it to GitHub Container Registry (free), because Azure
# for Students subscriptions cannot use ACR Tasks. Azure Container Apps (and later Cloud Run) pull
# ghcr.io/happii-ceasar-ivan/pitchy-backend. The image contains no secrets.

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/happii-ceasar-ivan/pitchy-backend:latest
            ghcr.io/happii-ceasar-ivan/pitchy-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
