# Pitchy safety rules (P-12). Loaded and validated by services/safety_engine/rules.py.
#
# Rules here come only from the listed sources; nothing is invented (AGENTS.md).
# Pitchy explains rules; it never makes the official decision. That stays with the people named
# in `decided_by` (FIFA manual: the match management team).
#
# How to change this file: edit a value AND its source, bump rule_set_version, run the tests.
# `status: draft` would make every assessment carry a RULES_NOT_APPROVED limitation; the team
# approved this rule set on 2026-11-23 (docs/decisions/safety-rules-files.md).

schema_version: 1
rule_set_version: "2026-11-23.3"
status: approved  # team approval 2026-11-23 (docs/decisions/safety-rules-files.md)

sources:
  fifa_ecm_2022:
    issuer: FIFA
    title: FIFA Emergency Care Manual
    version: "2022 (PDF dated 2022-09-30; no edition number printed)"
    section: "Chapter 9 Environmental emergencies: Prevention of heat-related illness, FIFA cooling breaks"
    pages: "printed pp. 189-191 (PDF pp. 191-193)"
    location: "references/FIFA Emergency Care Manual EN.pdf"
  afc_com_2026:
    issuer: Asian Football Confederation (AFC)
    title: AFC Competition Operations Manual
    version: "Edition 2026 (1 Dec update)"
    section: "Section 2 art. 8.3 (lightning); art. 20 Cooling Break; Appendix 20 Part A (extreme conditions)"
    pages: "printed p. 26 (8.3), p. 41 (20), pp. 199-200 (Appendix 20)"
    location: "references/AFC-Competition-Operations-Manual-Edition-2026---1-Dec-update.pdf"
  pff_heat_advisory:
    issuer: Philippine Football Federation (PFF)
    title: "PFF Advisory Update: Enhanced Safety for Football Activities During Extreme Heat"
    version: "undated on the page; read 2026-11-23"
    section: "introduction and item 1"
    location: "https://pff.org.ph/pff-advisory-update-enhanced-safety-for-football-activities-during-extreme-heat/"

hazards:
  heat:
    indicator: wbgt_outdoor
    unit: "°C"
    method: "Liljegren et al. (2008), DEC-05"
    measurement_note: >-
      FIFA and AFC measure WBGT on site 90 and 60 minutes before kickoff (FIFA: with a
      calibrated device; either reading at the level counts). AFC art. 20.4 says "exceed 32 °C"
      while its Appendix 20 says "32 °C and above"; the inclusive reading (FIFA's) is used. Pitchy's WBGT is a forecast estimate: it is
      always labelled as an estimate and never replaces the on-site measurement.
    evaluate_at_minutes_before_kickoff: [90, 60]  # FIFA's measurement times
    decided_by: "match management team (FIFA); venue medical officer recommends, referee implements (AFC)"
    level_sets:  # one set per competition age group; levels checked from the top
      - id: senior
        applies_to: "senior competitions (default)"
        levels:
          - id: cooling_breaks_required
            when: {gte: 32.0}
            source: fifa_ecm_2022
            also_supported_by: [afc_com_2026]
            label: "At or above the cooling-break level (WBGT 32 °C)"
            action: >-
              FIFA: cooling breaks must be used (after about 30 and 75 minutes of play), or the
              match may be postponed or cancelled depending on the WBGT level and the match
              management team's decision. AFC: the venue medical officer recommends cooling breaks
              (3 minutes, around the 30th and 75th minute, added as stoppage time); the referee
              implements them.
          - id: below_cooling_break_level
            when: {lt: 32.0}
            source: fifa_ecm_2022
            also_supported_by: [afc_com_2026]
            label: "Below the cooling-break level"
            action: >-
              No FIFA or AFC cooling-break trigger. This is not a statement that conditions are
              safe. FIFA asks officials to consult when WBGT is near 32 °C (no number given), and
              AFC also weighs time of day, cloud cover and stadium location.
      - id: youth_u20
        applies_to: "under-20 and younger age-group competitions"
        levels:
          - id: cooling_breaks_required
            when: {gte: 28.0}
            source: afc_com_2026
            label: "At or above the youth cooling-break level (WBGT 28 °C)"
            action: >-
              AFC: for under-20 and younger competitions, cooling breaks may be introduced from
              WBGT 28 °C (3 minutes, around the 30th and 75th minute, added as stoppage time),
              after consultation with the match officials; the referee implements them.
          - id: below_cooling_break_level
            when: {lt: 28.0}
            source: afc_com_2026
            label: "Below the youth cooling-break level"
            action: >-
              No AFC youth cooling-break trigger. This is not a statement that conditions are
              safe.
    notices:  # official guidance shown as information; never changes the level
      - id: pff_avoid_midday
        source: pff_heat_advisory
        applies_when:
          local_kickoff_between: ["09:00", "15:00"]
          timezone: Asia/Manila
        text: >-
          PFF advises regional associations to avoid sanctioned matches from 9 AM to 3 PM during
          extreme heat, until further advised, and to decide with caution using the local heat
          index. Organizers need an on-site ambulance and trained responders with an AED. The
          advisory is undated: check that it is still in force.
    not_applied:  # found in a source but unusable as a rule, with the reason
      - source: pff_heat_advisory
        rule: "above 32° should have cooling breaks or may be called off"
        reason: "The measure is not stated (air temperature, heat index or WBGT), so it cannot be compared with any value."

  lightning:
    status: guidance_only  # DEC-06: no automatic lightning status without lightning data
    source: afc_com_2026
    procedure:
      - "30 seconds: if thunder follows a lightning flash within 30 seconds or less, send teams and match officials to the dressing rooms and spectators to safe shelters."
      - "30 minutes: restart no earlier than 30 minutes after the last thunder is heard."
      - "If conditions do not improve in a reasonable time, the AFC General Coordinator and/or Match Commissioner may postpone or abandon the match, after consulting the host, safety officer and referee."
    applies_note: "AFC applies the 30/30 procedure when technology for detailed local forecasts is unavailable or unreliable. It is judged on site by the officials."
    show_when: "Lightning detected near the venue, or a PAGASA thunderstorm advisory or alert covering the venue."
    distance_levels:  # applied to the nearest detected flash; no level beyond them (never "safe")
      - id: within_30_second_distance
        when: {lte: 10.0}
        unit: km
        source: afc_com_2026
        basis: >-
          Team decision 2026-11-23: AFC's 30-second flash-to-thunder rule expressed as a distance.
          Sound travels about 343 m/s, so 30 s is about 10 km. This conversion is Pitchy's, not
          AFC's wording.
        label: "Lightning within about 10 km (AFC 30-second distance)"
        action: >-
          Under AFC's 30/30 procedure, players, officials and spectators take shelter; play
          restarts no earlier than 30 minutes after the last thunder. Officials on site decide.
    reason: >-
      Pitchy measures detection from Vaisala Xweather (past 5 minutes, up to 40 km), not
      thunder on site. It shows the procedure as official guidance and flags the 10 km level;
      it never declares "stop play".

  rainfall:
    status: no_approved_rule  # P-11 OPEN
    reason: "None of FIFA, AFC or PFF gives a rain rule (AFC only weighs rain for cold and ground conditions)."
    show_instead: "Forecast rain amounts with source and time, and official PAGASA alerts."
